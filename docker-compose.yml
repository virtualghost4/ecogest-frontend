services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecogest-frontend
    ports:
      - "3000:80"
    networks:
      - ecogest-backend_ecogest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ecogest-backend_ecogest-network:
    driver: bridge
    external: true
