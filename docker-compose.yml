version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecogest-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - ecogest-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O- http://localhost/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ecogest-network:
    external: true
    name: ecogest-network